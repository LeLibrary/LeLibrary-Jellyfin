name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build, test and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Test
        run: dotnet test -c Release --nologo

      - name: Build the plugin repository
        run: |
          chmod +x scripts/local-repo.sh
          SOURCE_BASE=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }} \
            PAGES_BASE=${{ steps.pages.outputs.base_url }} \
            DOTNET=dotnet bash scripts/local-repo.sh

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v heading="## $version" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > /tmp/lelibrary-release-notes.md
          test -s /tmp/lelibrary-release-notes.md

      - name: Attach the zips
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/repo/*.zip
          body_path: /tmp/lelibrary-release-notes.md

      - name: Publish the plugin repository to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/repo

  pages:
    name: Publish the manifest
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
