name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    name: Build, test and release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The 10.11 build targets .NET 9 and the Jellyfin 12 build .NET 10.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Test
        run: dotnet test -c Release -f net10.0 --nologo

      - name: Build the plugin repository
        run: |
          chmod +x scripts/local-repo.sh
          SOURCE_BASE=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }} \
            DOTNET=dotnet bash scripts/local-repo.sh

      - name: Attach the zips
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/repo/*.zip
          generate_release_notes: true

      - name: Publish the plugin repository to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/repo

  pages:
    name: Publish the manifest
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
